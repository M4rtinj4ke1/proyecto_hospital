server:
  port: 8086
  error:
    include-message: always

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bd_recetas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:mysql://localhost:3306/bd_recetas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    user: root
    password:
  mvc:
    problemdetails:
      enabled: false
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true